<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Wallboard — 留学生课业壁纸</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bgA" class="bglayer"></div>
<div id="bgB" class="bglayer"></div>
<div id="dim"></div>
<div id="board">
  <div id="clocks"   class="panel pos-tr"></div>
  <div id="weekbar"  class="panel pos-tl"></div>
  <div id="courses"  class="panel pos-ml"><div class="title">今天 · Today</div><div id="courselist">—</div></div>
  <div id="deadlines" class="panel pos-bl"><div class="title">Next Deadline</div><div id="ddllist">—</div></div>
  <div id="events"   class="panel pos-br"><div class="title">Countdown</div><div id="eventlist">—</div></div>
</div>
<script src="app.js"></script>
</body>
</html>
